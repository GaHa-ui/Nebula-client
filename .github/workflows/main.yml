name: Build Nebula Client

on:
  push:
    branches:
      - codex/develop-nebula-client-for-minecraft
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build mod jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build and verify
        run: gradle clean build verifyNebula --no-daemon

      - name: Create checksum
        run: sha256sum build/libs/NebulaClient-1.0.0+1.21.11.jar > build/libs/NebulaClient-1.0.0+1.21.11.jar.sha256

      - name: Upload testable jar
        uses: actions/upload-artifact@v4
        with:
          name: NebulaClient-1.0.0+1.21.11
          path: |
            build/libs/NebulaClient-1.0.0+1.21.11.jar
            build/libs/NebulaClient-1.0.0+1.21.11.jar.sha256
          if-no-files-found: error
